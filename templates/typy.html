{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 p-md-5 rounded-3 border shadow-sm">
    <h1 class="fw-bold mb-4">Typy Pokémonů</h1>
    <p class="text-muted mb-4">Přehled základních typů Pokémonů:</p>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="p-3 border rounded bg-warning-subtle text-dark">
                <h5 class="fw-bold mb-1">⚡ Electric (Elektrický)</h5>
                <small>Silný proti létajícím a vodním typům.</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 border rounded bg-primary-subtle text-dark">
                <h5 class="fw-bold mb-1">💧 Water (Vodní)</h5>
                <small>Silný proti ohnivým a kamenným typům.</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 border rounded bg-danger-subtle text-dark">
                <h5 class="fw-bold mb-1">🔥 Fire (Ohnivý)</h5>
                <small>Silný proti travním a hmyzím typům.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
