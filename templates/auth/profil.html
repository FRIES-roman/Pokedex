{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Profil trenéra</h1>
    {% if uzivatel %}
        <ul class="list-group mt-3">
            <li class="list-group-item"><strong>Jméno:</strong> {{ uzivatel.jmeno }} {{ uzivatel.prijmeni }}</li>
            <li class="list-group-item"><strong>Přezdívka:</strong> {{ uzivatel.nickname }}</li>
            <li class="list-group-item"><strong>E-mail:</strong> {{ uzivatel.email }}</li>
            <li class="list-group-item"><strong>Role:</strong> {{ uzivatel.role }}</li>
        </ul>
    {% endif %}
</div>
{% endblock %}
