{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 p-md-5 rounded-3 border shadow-sm">
    <h1 class="fw-bold mb-4">Katalog Pokémonů</h1>
    <p class="text-muted mb-4">Procházej seznam Pokémonů v databázi:</p>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for pokemon in pokemons %}
        <div class="col">
            <div class="card h-100 border shadow-sm text-center">
                <div class="p-3 bg-light rounded-top">
                    <img src="{{ pokemon.image }}" class="img-fluid" style="max-height: 140px;" alt="{{ pokemon.name }}">
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">{{ pokemon.name }}</h5>
                    <span class="badge bg-danger mb-2">{{ pokemon.type }}</span>
                    <p class="card-text text-secondary small">{{ pokemon.description }}</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
